<!--
  ============================================================
  MiraiCast Lab — interactieve architectuurviewer  v0.1.0
  ============================================================

  Repo:   MiraiCastLab (nl.icthorse.miraicastlab) — v0.1.0 "Mirai-1"
  Basis:  Meta_Master/templates/viewer_template.html v0.1.0

  Standalone single-file HTML: geen CDN, geen externe scripts of
  stylesheets, werkt via file://. Deterministisch: in het renderpad
  zit geen wall-clock-tijd en geen toevalsgenerator, dus dezelfde
  view levert altijd exact dezelfde tekening op.

  Views (5):  Conceptueel · Logisch · Fysiek · Transacties · Journeys
  Animatie:   Transacties (3 scenario's) + Journeys (2 scenario's),
              met Play / Pause / Step / Loop / snelheid.
  Notatie:    ArchiMate <-> Dragon1 — zelfde notatie-agnostische
              model-JSON, ander renderpad.
  DSL:        import + export van architectuur/MiraiCastLab_archdsl.dsl

  HERKOMST — elk element, elke relatie en elke animatiestap is
  herleidbaar tot een bron in de repo. Die bron staat per element in
  het veld `src` en is zichtbaar als tooltip. Wat in de repo niet is
  vastgelegd draagt een zichtbare <<TBD>>-markering in het label; er
  is niets aangevuld met een plausibele aanname.

  Bronnen:
    docs/architecture.md                          (component-map, evidence-model,
                                                   cause-and-effect, non-goals)
    docs/DEPENDENCIES.md                          (runtime, build, platform-surfaces)
    docs/PRINCIPLES.md                            (P1-P12)
    SAFETY.md                                     (de grens die dit project niet overgaat)
    docs/toyota-mirai-2025-test-procedure.md      (de journeys)
    README.md · ARCHITECTURE.md · BUILD.md · version.json
    app/src/main/AndroidManifest.xml              (componenten, permissies, queries)
    core/ProbeRegistry.kt (12 probes) · core/Probe.kt (safeObserve)
    ui/LabNavHost.kt (14 destinations) · projection/CaptureEngine.kt
    report/ReportGenerator.kt · report/ReportScreen.kt · tools/*/README.md
  ============================================================
-->

/* Element-styling */

.heat-dropdown { display: inline-flex; align-items: center; gap: 6px; }

/* --- Type -> Layer mapping (ArchiMate 3.2 + C4 + Dragon1) --- */

/* --- Relatie-type-inferentie tabel (subset uit AModeler parser.js v3) --- */
const REL_INFER = {
  'businessactor->businessprocess': 'assignment',
  'businessactor->businessrole': 'assignment',
  'businessrole->businessprocess': 'assignment',
  'businessprocess->businessservice': 'realization',

  'systemsoftware->applicationcomponent': 'serving',
  'systemsoftware->node': 'assignment',
  'device->systemsoftware': 'assignment',
  'node->device': 'serving',
  'node->artifact': 'access',
  'node->systemsoftware': 'assignment',

  'artifact->device': 'access',

  'businessactor->businessprocess': 'assignment',
  'businessprocess->businessprocess': 'triggers',

  'businessevent->businessprocess': 'triggers',
  'businessevent->businessevent': 'triggers',
  'businessevent->businessobject': 'access',
  'businessprocess->businessobject': 'access'
};
function inferRelType(fromType, toType) {
  const k = (fromType || '').toLowerCase() + '->' + (toType || '').toLowerCase();
  return REL_INFER[k] || 'flow';
}

/* --- Relatie-styling per type --- */
const REL_STYLE = {
  assignment:    { dash: 'none',  marker: 'arrow',        startMarker: 'dot' },

/* ============================================================

      "id": "scan_chain",
      "label": "a. Capability scan (dashboard -> 12 probes -> evidence)",
      "source": "docs/architecture.md §5 · core/ProbeRegistry.kt",
      "steps": [
        {
          "rel": "t01",
          "narrative": "Tester taps RUN DEVICE SCAN on the dashboard; ProbeRegistry.runAll(context, onProgress) starts. [docs/architecture.md §5]"
        },
        {
          "rel": "t02",
          "narrative": "runAll walks ProbeRegistry.all in scan order and calls probe.safeObserve for each. [core/ProbeRegistry.kt]"
        },
        {
          "rel": "t03",
          "narrative": "Probe 1/12: DeviceProbe - read-only, idempotent, non-throwing. [scan/DeviceProbe.kt]"
        },
        {
          "rel": "t04",
          "narrative": "Probe 2/12: CodecProbe - read-only, idempotent, non-throwing. [scan/CodecProbe.kt]"
        },
        {
          "rel": "t05",
          "narrative": "Probe 3/12: DisplayProbe - read-only, idempotent, non-throwing. [display/DisplayProbe.kt]"
        },
        {
          "rel": "t06",
          "narrative": "Probe 4/12: MediaRouteProbe - read-only, idempotent, non-throwing. [display/MediaRouteProbe.kt]"
        },
        {
          "rel": "t07",
          "narrative": "Probe 5/12: WifiP2pProbe - read-only, idempotent, non-throwing. [net/WifiP2pProbe.kt]"
        },
        {
          "rel": "t08",
          "narrative": "Probe 6/12: ConnectivityProbe - read-only, idempotent, non-throwing. [net/ConnectivityProbe.kt]"
        },
        {
          "rel": "t09",
          "narrative": "Probe 7/12: AudioRouteProbe - read-only, idempotent, non-throwing. [audio/AudioRouteProbe.kt]"
        },
        {
          "rel": "t10",
          "narrative": "Probe 8/12: InputDeviceProbe - read-only, idempotent, non-throwing. [input/InputDeviceProbe.kt]"
        },
        {
          "rel": "t11",
          "narrative": "Probe 9/12: ProjectionCapabilityProbe - read-only, idempotent, non-throwing. [projection/ProjectionCapabilityProbe.kt]"
        },
        {
          "rel": "t12",
          "narrative": "Probe 10/12: SmartViewProbe - read-only, idempotent, non-throwing. [samsung/SmartViewProbe.kt]"
        },
        {
          "rel": "t13",
          "narrative": "Probe 11/12: DexProbe - read-only, idempotent, non-throwing. [samsung/DexProbe.kt]"
        },
        {
          "rel": "t14",
          "narrative": "Probe 12/12: AndroidAutoProbe - read-only, idempotent, non-throwing. [auto/AndroidAutoProbe.kt]"
        },
        {
          "rel": "t15",
          "narrative": "FAILURE PATH: a probe throws. safeObserve catches the throwable. [core/Probe.kt]"
        },
        {
          "rel": "t16",
          "narrative": "It becomes Observation.error whose note says the capability itself is untested - an ERROR observation, never a negative result about the device. [docs/PRINCIPLES.md P4]"
        },
        {
          "rel": "t23",
          "narrative": "Every probe returns a List<Observation>; each observation carries its own LabStatus. [docs/architecture.md §3]"
        },
        {
          "rel": "t29",
          "narrative": "SessionLogger.logAll(found): the single sink for the whole process. [core/ProbeRegistry.kt]"
        },
        {
          "rel": "t30",
          "narrative": "One LogRecord per observation: timestamp, elapsedRealtimeMs, testRunId, category, event, status, details. [README.md]"
        },
        {
          "rel": "t31",
          "narrative": "core/Json.kt serialises it - 50 lines, dependency-free. [docs/DEPENDENCIES.md]"
        },
        {
          "rel": "t32",
          "narrative": "Appended to evidence/run-<ts>-<id>.jsonl and flushed per line, so a process kill loses at most the current record. [docs/architecture.md §4.1]"
        },
        {
          "rel": "t33",
          "narrative": "The same record lands in the in-memory StateFlow, capped at 5000. [core/SessionLogger.kt]"
        },
        {
          "rel": "t35",
          "narrative": "Dashboard and screens collect the StateFlow; DashboardKeys.missingFrom() marks any key no probe produced. [docs/architecture.md §3, §5]"
        },
        {
          "rel": "t36",
          "narrative": "capability_scan_complete is logged with the probe and observation counts. [core/ProbeRegistry.kt]"
        }
      ]
    },
    {
      "id": "projection_chain",
      "label": "b. MediaProjection consent chain (Android 14 ordering)",
      "source": "projection/CaptureEngine.kt KDoc · docs/architecture.md §4.5",
      "steps": [
        {
          "rel": "t40",
          "narrative": "MediaProjectionScreen requests POST_NOTIFICATIONS through LabPermissions, with a tester-facing reason. Denial degrades the probe to NOT_TESTED; it never blocks the app. [SAFETY.md]"
        },
        {
          "rel": "t41",
          "narrative": "MediaProjectionManager.createScreenCaptureIntent - the consent dialog. Step 1 of the non-negotiable order. [projection/CaptureEngine.kt]"
        },
        {
          "rel": "t42",
          "narrative": "Consent granted -> start the foreground service, type mediaProjection. Step 2. [docs/architecture.md §4.5]"
        },
        {
          "rel": "t51",
          "narrative": "ProjectionService logs projection_service_started (CONFIRMED) with the SDK level. It holds no capture logic. [projection/ProjectionService.kt]"
        },
        {
          "rel": "t43",
          "narrative": "getMediaProjection(resultCode, data). Step 3. [projection/CaptureEngine.kt]"
        },
        {
          "rel": "t48",
          "narrative": "CONSTRAINT: Android 14+ refuses createVirtualDisplay unless the FGS is already running, and requires registerCallback before it. Getting the order wrong throws SecurityException. [docs/architecture.md §4.5, docs/DEPENDENCIES.md]"
        },
        {
          "rel": "t44",
          "narrative": "registerCallback (step 4) and only then createVirtualDisplay (step 5). [projection/CaptureEngine.kt]"
        },
        {
          "rel": "t45",
          "narrative": "The VirtualDisplay draws into the Surface of an ImageReader. [projection/CaptureEngine.kt]"
        },
        {
          "rel": "t46",
          "narrative": "Frames arrive on a single HandlerThread and feed the H.264 encoder. [projection/H264Encoder.kt]"
        },
        {
          "rel": "t47",
          "narrative": "Capture FPS, VirtualDisplay metrics and encoder statistics are logged. [README.md screens table]"
        },
        {
          "rel": "t49",
          "narrative": "P3: what this proves is what the phone can capture and encode locally - nothing about what the Toyota head unit receives. [projection/CaptureEngine.kt KDoc]"
        },
        {
          "rel": "t50",
          "narrative": "So an explicit NOT_TESTED observation is logged at the end of every session, so the claim cannot drift in the report. [docs/PRINCIPLES.md P3]"
        }
      ]
    },

/* ============================================================
 * STATE
 * ============================================================ */
let MODEL = clone(DEFAULT_MODEL);
let currentViewId = 'conceptueel';
let currentNotation = 'archimate';
let currentHeat = 'off'; // off | criticality | completion | cost — actief alleen in Dragon1-modus
let currentRenderMode = 'blueprint'; // blueprint | sketch — actief alleen in Dragon1-modus
let animState = {
  playing: false, loop: true, stepIdx: 0, scenarioId: null,
  speedMs: 1200, rafHandle: null, lastTickAt: 0, tokenEl: null
};

/* ============================================================
 * UTIL
 * ============================================================ */
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function el(tag, attrs) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function log(msg) {
  const lg = document.getElementById('log');
  lg.classList.remove('empty');
  lg.textContent = msg;
}
function clearLog() {
  const lg = document.getElementById('log');
  lg.classList.add('empty');
  lg.textContent = '';
}
function elemById(id) { return MODEL.elements.find(e => e.id === id); }
function relById(id) { return MODEL.relations.find(r => r.id === id); }
function viewById(id) { return MODEL.views.find(v => v.id === id); }
function scenarioById(id) { return (MODEL.scenarios || []).find(s => s.id === id); }
function typeLayer(type) { return TYPE_LAYER[(type || '').toLowerCase()] || 'other'; }

/* ============================================================
 * GEOMETRIE + PER-VIEW LAYOUT
 * Een element kan in meerdere views voorkomen; elke view mag zijn
 * eigen positie opgeven (view.layout). Zonder override geldt e.pos.
 * Volledig deterministisch: geen meting, geen random, geen tijd.
 * ============================================================ */
const ELEM_W = 176, ELEM_H = 72;
let VIEW_POS = {};
/* Per render-pass: welke relatie-labels al getekend zijn. Voorkomt dat
   'hosts' of 'returns' tien keer op dezelfde rij staat. */
let LABELS_DRAWN = null;
function applyViewLayout(view) { VIEW_POS = (view && view.layout) || {}; }
function posOf(e) {
  if (!e) return [0, 0];
  const p = VIEW_POS[e.id];
  return p ? p : (e.pos || [0, 0]);
}
function resizeCanvas(view) {
  const svg = document.getElementById('canvas');
  const c = (view && view.canvas) || [1300, 900];
  svg.setAttribute('width', c[0]);
  svg.setAttribute('height', c[1]);
  svg.setAttribute('viewBox', '0 0 ' + c[0] + ' ' + c[1]);
}
/* Deterministische woord-wrap op tekenlengte (geen DOM-meting). */
function wrapLabel(text, maxChars, maxLines) {
  const raw = String(text == null ? '' : text).split(/\s+/).filter(Boolean);
  // Een woord dat breder is dan het vak wordt hard gesplitst; anders loopt een
  // pad of constante (FLAG_GRANT_READ_URI_PERMISSION) buiten het element.
  const words = [];
  for (let w = 0; w < raw.length; w++) {
    let word = raw[w];
    while (word.length > maxChars) {
      words.push(word.slice(0, maxChars));
      word = word.slice(maxChars);
    }
    if (word) words.push(word);
  }
  const lines = [];
  let cur = '';
  for (let i = 0; i < words.length; i++) {
    const cand = cur ? cur + ' ' + words[i] : words[i];
    if (cand.length > maxChars && cur) {
      lines.push(cur);
      cur = words[i];
      if (lines.length === maxLines) { cur = ''; break; }
    } else {
      cur = cand;
    }
  }
  if (cur && lines.length < maxLines) lines.push(cur);
  const shown = lines.join(' ').split(/\s+/).filter(Boolean).length;
  if (shown < words.length && lines.length) {
    let last = lines[lines.length - 1];
    if (last.length > maxChars - 1) last = last.slice(0, maxChars - 1);
    lines[lines.length - 1] = last + '\u2026';
  }
  return lines.length ? lines : [''];
}
function appendWrappedLabel(g, e, cx, topY, maxChars, maxLines, lineH) {
  const lines = wrapLabel(e.label || e.id, maxChars, maxLines);
  const txt = el('text', { class: 'elem-label', x: cx, 'text-anchor': 'middle' });
  const y0 = topY + (maxLines - lines.length) * lineH / 2;
  for (let i = 0; i < lines.length; i++) {
    const ts = el('tspan', { x: cx, y: y0 + i * lineH });
    ts.textContent = lines[i];
    txt.appendChild(ts);
  }
  g.appendChild(txt);
}
/* Tooltip = label + type + toelichting + repo-bron (herkomst zichtbaar). */
function appendTooltip(g, obj, kind) {
  const t = el('title');
  let s = (obj.label || obj.id || '');
  if (kind === 'element' && obj.type) s += '\n\u00ab' + obj.type + '\u00bb';
  if (kind === 'relation') s = 'relatie ' + obj.id + ': ' + obj.from + ' \u2192 ' + obj.to +
                               (obj.label ? ' (' + obj.label + ')' : '');
  if (obj.description) s += '\n\n' + obj.description;
  if (obj.src) s += '\n\nBron in de repo: ' + obj.src;
  t.textContent = s;
  g.appendChild(t);
}

/* ============================================================
 * RENDER
 * ============================================================ */
function render() {
  const svg = document.getElementById('canvas');
  svg.innerHTML = '';
  svg.classList.remove('notation-archimate', 'notation-dragon1', 'sketch-mode');
  svg.classList.add('notation-' + currentNotation);
  if (currentNotation === 'dragon1' && currentRenderMode === 'sketch') {
    svg.classList.add('sketch-mode');
  }

  // 1. defs (markers + roughen-filter)
  svg.appendChild(buildDefs());

  // 2. bepaal welke elementen + relaties zichtbaar zijn in deze view
  const view = viewById(currentViewId);
  applyViewLayout(view);
  resizeCanvas(view);
  const visibleElems = filterElementsForView(view);
  const visibleIds = new Set(visibleElems.map(e => e.id));
  const visibleRels = MODEL.relations.filter(r =>
    visibleIds.has(r.from) && visibleIds.has(r.to)
  );

  // 2b. Landscape-backdrop — alleen Dragon1 + view = conceptueel/logisch (advies-keuze 3)
  const backdropViews = new Set(['conceptueel', 'logisch']);
  if (currentNotation === 'dragon1' && backdropViews.has(currentViewId)) {
    svg.appendChild(buildLandscapeBackdrop(view));
  }

  // 3. render relaties (lager z-order)
  LABELS_DRAWN = new Set();
  const relsGroup = el('g', { id: 'relations-layer' });
  visibleRels.forEach(r => relsGroup.appendChild(renderRelation(r)));
  svg.appendChild(relsGroup);

  // 4. render elementen
  const elemsGroup = el('g', { id: 'elements-layer' });
  visibleElems.forEach(e => elemsGroup.appendChild(renderElement(e)));
  svg.appendChild(elemsGroup);

  // 5. animatie-token-laag (apart, bovenop)
  const animLayer = el('g', { id: 'animation-layer' });
  svg.appendChild(animLayer);

  // 6. info-paneel + legenda updaten
  updateInfo(view, visibleElems.length, visibleRels.length);
  updateLegend(visibleElems);

  // 7. animatie controls aan/uit
  const animBox = document.getElementById('animControls');
  const scList = (view && view.scenarios && view.scenarios.length)
    ? view.scenarios
    : ((view && view.scenario) ? [view.scenario] : []);
  if (scList.length) {
    animBox.classList.add('visible');
    const sel = document.getElementById('scenarioSelect');
    if (sel.getAttribute('data-view-id') !== view.id) {
      sel.innerHTML = '';
      scList.forEach(function (sid) {
        const o = document.createElement('option');
        o.value = sid;
        o.textContent = (scenarioById(sid) || { label: sid }).label;
        sel.appendChild(o);
      });
      sel.setAttribute('data-view-id', view.id);
      sel.value = view.scenario || scList[0];
      animState.scenarioId = sel.value;
    }
    if (scList.indexOf(animState.scenarioId) === -1) {
      animState.scenarioId = scList[0];
      sel.value = scList[0];
    }
    const sc = scenarioById(animState.scenarioId) || { label: '?', steps: [] };
    document.getElementById('scenarioLabel').textContent =
      (sc.steps || []).length + ' stappen';
    animState.stepIdx = 0;
  } else {
    animBox.classList.remove('visible');
    stopAnimation();
  }
}

function filterElementsForView(view) {
  if (!view) return MODEL.elements;
  const layers = (view.include && view.include.layers) || null;
  const ids = (view.include && view.include.elements) || null;
  return MODEL.elements.filter(e => {
    if (ids && !ids.includes(e.id)) return false;
    if (layers && !layers.includes(typeLayer(e.type))) return false;
    return true;
  });
}

function buildDefs() {
  const defs = el('defs');
  // arrow
  const m1 = el('marker', {

  defs.appendChild(m1);
  // arrow-hollow
  const m2 = el('marker', {
    id: 'arrow-hollow', viewBox: '0 0 12 12', refX: '11', refY: '6',
    markerWidth: '10', markerHeight: '10', orient: 'auto-start-reverse'
  });
  m2.appendChild(el('path', {
    d: 'M0,0 L12,6 L0,12 z', fill: '#fff',
    stroke: 'var(--c-arrow)', 'stroke-width': '1.5'
  }));
  defs.appendChild(m2);
  // dot
  const m3 = el('marker', {
    id: 'dot', viewBox: '0 0 6 6', refX: '3', refY: '3',
    markerWidth: '6', markerHeight: '6'
  });
  m3.appendChild(el('circle', { cx: '3', cy: '3', r: '2.5', fill: 'var(--c-arrow)' }));
  defs.appendChild(m3);
  // diamond
  const m4 = el('marker', {
    id: 'diamond', viewBox: '0 0 12 8', refX: '0', refY: '4',
    markerWidth: '10', markerHeight: '8', orient: 'auto'
  });
  m4.appendChild(el('path', { d: 'M0,4 L6,0 L12,4 L6,8 z', fill: 'var(--c-arrow)' }));
  defs.appendChild(m4);
  // Roughen filter — Dragon1 sketch-mode. Fixed seed=42 voor determinisme.
  // Bron: docs/DRAGON1_VISUAL_LANGUAGE.md §4 (sketch / artist-impression).
  const fRough = el('filter', {
    id: 'roughen', x: '-5%', y: '-5%', width: '110%', height: '110%'
  });
  fRough.appendChild(el('feTurbulence', {
    type: 'fractalNoise', baseFrequency: '0.035', numOctaves: '2', seed: '42', result: 'noise'
  }));
  fRough.appendChild(el('feDisplacementMap', {
    in: 'SourceGraphic', in2: 'noise', scale: '2.5'
  }));
  defs.appendChild(fRough);
  return defs;
}

/* ============================================================
 * LANDSCAPE-BACKDROP — Dragon1's "principes-op-landschap"
 * Bron: docs/DRAGON1_VISUAL_LANGUAGE.md §2.
 * Tekent semi-transparante horizontale banden per zichtbare laag,
 * met laag-label rechtsachter (verbleekt) als "context".
 * View-afhankelijk: alleen Conceptueel + Logisch (advies-keuze 3).
 * ============================================================ */
const LAYER_BANDS = {
  // laag -> { y, height }; gekalibreerd op de layout van dit model.
  motivation:  { y:  10, h: 700 },
  strategy:    { y: 710, h: 260 },
  business:    { y:  10, h: 700 },
  application: { y:  10, h: 480 },
  technology:  { y: 490, h: 480 }
};
function buildLandscapeBackdrop(view) {
  const g = el('g', { class: 'landscape-backdrop' });
  if (!view) return g;
  // welke lagen toont deze view? gebruik dezelfde include als filterElementsForView.
  let layers = (view.include && view.include.layers) || null;
  if (!layers) {
    const seen = {};
    filterElementsForView(view).forEach(e2 => { seen[typeLayer(e2.type)] = 1; });
    layers = Object.keys(seen);
  }
  layers.forEach(ln => {
    const band = LAYER_BANDS[ln];
    if (!band) return;
    const fill = LAYER_FILL[ln] || LAYER_FILL.other;
    const cw = (view.canvas && view.canvas[0]) || 1300;
    g.appendChild(el('rect', {
      x: 0, y: band.y, width: cw, height: band.h, fill: fill
    }));
    const txt = el('text', {
      x: cw - 20, y: band.y + 36, 'text-anchor': 'end'
    });
    txt.textContent = (LAYER_LABEL[ln] || ln).toUpperCase();
    g.appendChild(txt);
  });
  return g;
}

/* ============================================================
 * ELEMENT RENDERING — notatie-specifiek
 * ============================================================ */
function renderElement(e) {
  if (currentNotation === 'dragon1') return renderElementDragon1(e);
  return renderElementArchiMate(e);
}

/* ArchiMate-modus: rechte rechthoek + «Type»-banner + icoon-rechtsboven */
function renderElementArchiMate(e) {
  const W = ELEM_W, H = ELEM_H;
  const [x, y] = posOf(e);
  const layer = typeLayer(e.type);
  const fill = e.fill || LAYER_FILL[layer] || LAYER_FILL.other;
  const stroke = e.stroke || LAYER_STROKE[layer] || LAYER_STROKE.other;
  const g = el('g', { 'data-id': e.id, transform: 'translate(' + x + ',' + y + ')' });
  // banner-strook bovenaan voor het type
  const rect = el('rect', {
    class: 'elem-rect', x: 0, y: 0, width: W, height: H,
    style: 'fill:' + fill + ';stroke:' + stroke
  });
  g.appendChild(rect);
  // type-banner
  const banner = el('text', {
    class: 'elem-type-banner', x: 6, y: 12
  });
  banner.textContent = '«' + (TYPE_BANNER[(e.type || '').toLowerCase()] || e.type || '') + '»';
  g.appendChild(banner);
  // icoon rechtsboven (16x16)
  g.appendChild(renderTypeIcon(e.type, W - 22, 4, 16));
  // label (gewrapt, deterministisch)
  appendWrappedLabel(g, e, W / 2, 28, 27, 4, 12);
  appendTooltip(g, e, 'element');
  return g;
}

/* ============================================================
 * HEAT — data-driven kleur-interpolatie (Dragon1-eigen)
 * Bron: docs/DRAGON1_VISUAL_LANGUAGE.md §3 (data-driven dynamic styling)
 * Mapping per attribuut:
 *   criticality, cost  → 0 = groen (laag), 1 = rood (hoog)
 *   completion         → 0 = rood  (open), 1 = groen (klaar) — geïnverteerd
 * ============================================================ */
function heatValue(e, mode) {
  if (mode === 'off') return null;
  const v = e[mode];
  if (typeof v !== 'number') return null;
  // completion: 1.0 = klaar = groen → inverteer naar "hoeveel rood"
  return mode === 'completion' ? (1 - v) : v;
}
function heatToColor(t) {
  // t = 0 (groen) → 0.5 (geel) → 1 (rood). Lineaire RGB-interpolatie.
  if (t == null) return null;
  t = Math.max(0, Math.min(1, t));
  const stops = [
    [34, 197, 94],   // --heat-low  #22c55e
    [234, 179, 8],   // --heat-mid  #eab308
    [239, 68, 68]    // --heat-high #ef4444
  ];
  const seg = t < 0.5 ? 0 : 1;
  const localT = seg === 0 ? t * 2 : (t - 0.5) * 2;
  const a = stops[seg], b = stops[seg + 1];
  const r = Math.round(a[0] + (b[0] - a[0]) * localT);
  const g = Math.round(a[1] + (b[1] - a[1]) * localT);
  const bl = Math.round(a[2] + (b[2] - a[2]) * localT);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

/* ============================================================
 * Dragon1-modus: ovaal-shape per type, data-driven heat-fill,
 * geen banner, geen icoon-rechtsboven.
 * Bron: docs/DRAGON1_VISUAL_LANGUAGE.md §1 (ovaal-primitief)
 * ============================================================ */
function renderElementDragon1(e) {
  const W = ELEM_W, H = ELEM_H;
  const [x, y] = posOf(e);
  const layer = typeLayer(e.type);
  const layerFill = e.fill || LAYER_FILL[layer] || LAYER_FILL.other;
  const stroke = e.stroke || LAYER_STROKE[layer] || LAYER_STROKE.other;
  const t = (e.type || '').toLowerCase();

  // Heat-fill heeft voorrang op layer-fill (alleen in Dragon1-modus)
  const heatT = heatValue(e, currentHeat);
  const heatFill = heatToColor(heatT);
  const fill = heatFill || layerFill;

  const g = el('g', {
    'data-id': e.id,
    'data-criticality': e.criticality != null ? e.criticality : '',
    'data-completion':  e.completion  != null ? e.completion  : '',
    'data-cost':        e.cost        != null ? e.cost        : '',
    transform: 'translate(' + x + ',' + y + ')'
  });

  const cx = W / 2, cy = H / 2;
  let shape;

  if (t === 'communicationnetwork' || t === 'path') {
    // dunne, langwerpige ellips (signaal-kanaal-suggestie)
    shape = el('ellipse', {
      class: 'elem-shape',
      cx: cx, cy: cy, rx: W / 2 - 4, ry: 12,
      style: 'fill:' + fill + ';stroke:' + stroke + ';stroke-width:1.8'
    });
  } else if (t === 'node' || t === 'device' || t === 'equipment') {
    // ovaal met depth-shadow (Dragon1's "concept met substantie")
    shape = el('g');
    shape.appendChild(el('ellipse', {
      cx: cx + 6, cy: cy + 6, rx: W / 2 - 6, ry: H / 2 - 4,
      fill: stroke, opacity: '0.22'
    }));
    shape.appendChild(el('ellipse', {
      class: 'elem-shape',
      cx: cx, cy: cy, rx: W / 2 - 6, ry: H / 2 - 4,
      style: 'fill:' + fill + ';stroke:' + stroke + ';stroke-width:1.8'
    }));
  } else if (t === 'businessactor' || t === 'person' || t === 'stakeholder') {
    // staande ovaal (persoon-suggestie, geen rechthoek)
    shape = el('ellipse', {
      class: 'elem-shape',
      cx: cx, cy: cy, rx: W / 2 - 18, ry: H / 2 - 2,
      style: 'fill:' + fill + ';stroke:' + stroke + ';stroke-width:1.8'
    });
  } else if (t === 'dataobject' || t === 'businessobject' || t === 'artifact') {
    // cilinder-look: bovenkant-ellips + romp + onder-ellips
    shape = el('g');
    const rx = W / 2 - 8;
    shape.appendChild(el('path', {
      d: 'M ' + (cx - rx) + ',' + cy + ' L ' + (cx - rx) + ',' + (cy + H / 2 - 8) +
         ' A ' + rx + ' 6 0 0 0 ' + (cx + rx) + ',' + (cy + H / 2 - 8) +
         ' L ' + (cx + rx) + ',' + cy + ' Z',
      style: 'fill:' + fill + ';stroke:' + stroke + ';stroke-width:1.8',
      class: 'elem-shape'
    }));
    shape.appendChild(el('ellipse', {
      cx: cx, cy: cy, rx: rx, ry: 6,
      style: 'fill:' + fill + ';stroke:' + stroke + ';stroke-width:1.8'
    }));
  } else {
    // DEFAULT — pure ovaal-concept (Dragon1's primaire primitief)
    shape = el('ellipse', {
      class: 'elem-shape',
      cx: cx, cy: cy, rx: W / 2 - 4, ry: H / 2 - 2,
      style: 'fill:' + fill + ';stroke:' + stroke + ';stroke-width:1.8'
    });
  }
  g.appendChild(shape);

  // Label centraal (geen banner, geen icoon-rechtsboven)
  appendWrappedLabel(g, e, cx, 22, 23, 4, 12);
  appendTooltip(g, e, 'element');

  // Heat-badge rechtsboven (alleen als heat actief én waarde aanwezig)
  if (heatT != null) {
    const badge = el('g', { transform: 'translate(' + (W - 14) + ',12)' });
    badge.appendChild(el('circle', {
      cx: 0, cy: 0, r: 8,
      style: 'fill:' + heatFill + ';stroke:#222;stroke-width:0.8'
    }));
    const txt = el('text', {
      x: 0, y: 3, 'text-anchor': 'middle',
      style: 'font-size:9px;font-weight:600;fill:#fff;pointer-events:none'
    });
    txt.textContent = Math.round(heatT * 100);
    badge.appendChild(txt);
    g.appendChild(badge);
  }

  return g;
}

/* ============================================================
 * RELATIE RENDERING
 * ============================================================ */
function renderRelation(r) {
  const W = ELEM_W, H = ELEM_H;
  const from = elemById(r.from), to = elemById(r.to);
  if (!from || !to) return el('g');
  const fp = posOf(from), tp = posOf(to);
  const [x1, y1] = fp, [x2, y2] = tp;
  // verbind midpoints
  const cx1 = x1 + W / 2, cy1 = y1 + H / 2;
  const cx2 = x2 + W / 2, cy2 = y2 + H / 2;
  const relType = r.type || inferRelType(from.type, to.type);
  const style = REL_STYLE[relType] || REL_STYLE.flow;
  const g = el('g', { 'data-rel-id': r.id });
  appendTooltip(g, Object.assign({}, r, { type: relType }), 'relation');
  const line = el('line', {
    class: 'rel-line' + (style.dash === '5,4' ? ' dashed' : (style.dash === '2,3' ? ' dotted' : '')),
    x1: cx1, y1: cy1, x2: cx2, y2: cy2,
    style: r.stroke ? 'stroke:' + r.stroke : ''
  });
  if (style.marker === 'arrow') line.setAttribute('marker-end', 'url(#arrow)');
  else if (style.marker === 'arrow-hollow') line.setAttribute('marker-end', 'url(#arrow-hollow)');
  if (style.startMarker === 'dot') line.setAttribute('marker-start', 'url(#dot)');
  else if (style.startMarker === 'diamond') line.setAttribute('marker-start', 'url(#diamond)');
  g.appendChild(line);
  // label - identieke labels binnen een view worden maar een keer getekend, en
  // een kort horizontaal verband krijgt zijn label boven de vakken in plaats van
  // in de smalle tussenruimte waar het onleesbaar achter een element verdwijnt.
  if (r.label && LABELS_DRAWN && !LABELS_DRAWN.has(r.label)) {
    LABELS_DRAWN.add(r.label);
    const lx = (cx1 + cx2) / 2;
    const flat = Math.abs(cy2 - cy1) < 8 && Math.abs(cx2 - cx1) < W * 2.2;
    const ly = flat ? (cy1 - H / 2 - 7) : ((cy1 + cy2) / 2 - 4);
    const bg = el('rect', {
      class: 'rel-label-bg',
      x: lx - r.label.length * 3.2 - 2, y: ly - 9,
      width: r.label.length * 6.4 + 4, height: 12
    });
    g.appendChild(bg);
    const txt = el('text', {
      class: 'rel-label', x: lx, y: ly, 'text-anchor': 'middle'
    });
    txt.textContent = r.label;
    g.appendChild(txt);
  }
  return g;
}

/* ============================================================
 * ANIMATIE — Transacties + Journeys
 * RAF-loop, deterministisch t.o.v. step-volgorde.
 * ============================================================ */
function startAnimation() {
  const s = scenarioById(animState.scenarioId);
  if (!s) return;
  animState.playing = true;
  animState.lastTickAt = performance.now();
  if (!animState.tokenEl) {
    animState.tokenEl = el('circle', { class: 'anim-token', r: 7, cx: 0, cy: 0 });
    document.getElementById('animation-layer').appendChild(animState.tokenEl);
  }
  tickAnimation();
}
function stopAnimation() {
  animState.playing = false;
  if (animState.rafHandle) cancelAnimationFrame(animState.rafHandle);
  if (animState.tokenEl && animState.tokenEl.parentNode) {
    animState.tokenEl.parentNode.removeChild(animState.tokenEl);
  }
  animState.tokenEl = null;
}
function tickAnimation() {
  if (!animState.playing) return;
  const s = scenarioById(animState.scenarioId);
  if (!s || !s.steps.length) return;
  const now = performance.now();
  const elapsed = now - animState.lastTickAt;
  const t = Math.min(1, elapsed / animState.speedMs);
  const step = s.steps[animState.stepIdx];
  const r = relById(step.rel);
  if (r) {
    const from = elemById(r.from), to = elemById(r.to);
    if (from && to) {
      const W = ELEM_W, H = ELEM_H;
      const fp = posOf(from), tp = posOf(to);
      const cx1 = fp[0] + W / 2, cy1 = fp[1] + H / 2;
      const cx2 = tp[0] + W / 2, cy2 = tp[1] + H / 2;
      const x = cx1 + (cx2 - cx1) * t;
      const y = cy1 + (cy2 - cy1) * t;
      if (animState.tokenEl) {
        animState.tokenEl.setAttribute('cx', x);
        animState.tokenEl.setAttribute('cy', y);
      }
      log('Step ' + (animState.stepIdx + 1) + '/' + s.steps.length + ': ' + (step.narrative || r.id));
    }
  }
  if (t >= 1) {
    animState.stepIdx++;
    animState.lastTickAt = now;
    if (animState.stepIdx >= s.steps.length) {
      if (animState.loop) {
        animState.stepIdx = 0;
      } else {
        animState.playing = false;
        return;
      }
    }
  }
  animState.rafHandle = requestAnimationFrame(tickAnimation);
}
function stepAnimation() {
  const s = scenarioById(animState.scenarioId);
  if (!s) return;
  animState.stepIdx = (animState.stepIdx + 1) % s.steps.length;
  if (!animState.tokenEl) {
    animState.tokenEl = el('circle', { class: 'anim-token', r: 7, cx: 0, cy: 0 });
    document.getElementById('animation-layer').appendChild(animState.tokenEl);
  }
  const step = s.steps[animState.stepIdx];
  const r = relById(step.rel);
  if (r) {
    const from = elemById(r.from), to = elemById(r.to);
    if (from && to) {
      const W = ELEM_W, H = ELEM_H;
      const tp = posOf(to);
      const cx2 = tp[0] + W / 2, cy2 = tp[1] + H / 2;
      animState.tokenEl.setAttribute('cx', cx2);
      animState.tokenEl.setAttribute('cy', cy2);
      log('Step ' + (animState.stepIdx + 1) + '/' + s.steps.length + ': ' + (step.narrative || r.id));
    }
  }
}

/* ============================================================
 * DSL PARSER — ArchDSL DSL-B subset, Dragon1-compatibel.
 *   Element:   PascalType id "Label" { -attrs }
 *   Relatie:   from -> to "label" { -attrs }      (NOOIT :type — engine infereert)
 *   Viewpoint: Viewpoint id "Label" { -description ... -attr k = v }
 *   Slide:     Slide id "Label" { -attr step_NN = "relId :: narratief" }
 *   Overig:    set / pos
 * Attribuutsleutels blijven beperkt tot de gedeelde set:
 *   -fill -stroke -color -icon -description -attr k = v
 * ============================================================ */
function parseDSL(text) {
  const m = {
    meta: { title: '', subtitle: '', language: 'archimate' },
    elements: [], relations: [], views: [], scenarios: []
  };
  const lines = String(text).split(/\r?\n/);
  let i = 0, relIdx = 0;

  /* Leest een `{ ... }`-body, zowel op één regel als meerregelig. */
  function readBody(firstLine, startIdx) {
    const open = firstLine.indexOf('{');
    if (open === -1) return ['', startIdx + 1];
    const close = firstLine.lastIndexOf('}');
    if (close > open) return [firstLine.slice(open + 1, close), startIdx + 1];
    let body = firstLine.slice(open + 1) + ' ';
    let j = startIdx + 1;
    while (j < lines.length) {
      if (/^\s*\}/.test(lines[j])) { j++; break; }
      body += lines[j] + ' ';
      j++;
    }
    return [body, j];
  }

  function attrParse(body, target) {
    target.attrs = target.attrs || {};
    const reAttr = /-attr\s+([\w.]+)\s*=\s*(?:"([^"]*)"|(\S+))/g;
    let mm;
    while ((mm = reAttr.exec(body)) !== null) {
      target.attrs[mm[1]] = mm[2] !== undefined ? mm[2] : mm[3];
    }
    const rest = body.replace(/-attr\s+[\w.]+\s*=\s*(?:"[^"]*"|\S+)/g, ' ');
    const re = /-(\w+)\s+(?:=\s*)?(?:"([^"]*)"|([^\s"]+))/g;
    while ((mm = re.exec(rest)) !== null) {
      const k = mm[1], v = mm[2] !== undefined ? mm[2] : mm[3];
      if (k === 'fill') target.fill = v;
      else if (k === 'stroke') target.stroke = v;
      else if (k === 'color') target.color = v;
      else if (k === 'icon') target.icon = v;
      else if (k === 'description') target.description = v;
    }
    return target;
  }

  while (i < lines.length) {
    const rawLine = lines[i];
    const line = rawLine.replace(/(?:^|\s)(?:#|\/\/).*$/, '').trim();
    if (!line) { i++; continue; }

    let mm = line.match(/^set\s+(language|title|subtitle|purpose)\s+(.+)$/i);
    if (mm) { m.meta[mm[1].toLowerCase()] = mm[2].replace(/^"|"$/g, ''); i++; continue; }

    mm = line.match(/^pos\s+(\w[\w.-]*)\s+(-?\d+)\s*,\s*(-?\d+)\s*$/);
    if (mm) {
      const t = m.elements.find(x => x.id === mm[1]);
      if (t) t.pos = [parseInt(mm[2], 10), parseInt(mm[3], 10)];
      i++; continue;
    }

    mm = line.match(/^Viewpoint\s+(\w[\w.-]*)\s+"([^"]+)"/);
    if (mm) {
      const v = { id: mm[1], label: mm[2], description: '', include: {}, layout: {} };
      const rb = readBody(line, i); i = rb[1];
      const box = attrParse(rb[0], {});
      if (box.description) v.description = box.description;
      const a = box.attrs || {};
      if (a.src) v.source = a.src;
      if (a.canvas) v.canvas = a.canvas.split(',').map(n => parseInt(n, 10));
      if (a.elements) v.include.elements = a.elements.split(',').filter(Boolean);
      if (a.layout) {
        a.layout.split('|').filter(Boolean).forEach(part => {
          const p = part.split(':');
          if (p.length === 2) {
            const xy = p[1].split(',').map(n => parseInt(n, 10));
            v.layout[p[0]] = xy;
          }
        });
      }
      if (a.scenarios) v.scenarios = a.scenarios.split(',').filter(Boolean);
      if (a.scenario_default) v.scenario = a.scenario_default;
      m.views.push(v); continue;
    }

    mm = line.match(/^Slide\s+(\w[\w.-]*)\s+"([^"]+)"/);
    if (mm) {
      const s = { id: mm[1], label: mm[2], steps: [] };
      const rb = readBody(line, i); i = rb[1];
      const box = attrParse(rb[0], {});
      if (box.description) s.description = box.description;
      const a = box.attrs || {};
      if (a.src) s.source = a.src;
      if (a.view) s.view = a.view;
      Object.keys(a).filter(k => /^step_\d+$/.test(k)).sort().forEach(k => {
        const val = a[k];
        const idx = val.indexOf('::');
        if (idx === -1) s.steps.push({ rel: val.trim() });
        else s.steps.push({ rel: val.slice(0, idx).trim(), narrative: val.slice(idx + 2).trim() });
      });
      m.scenarios.push(s); continue;
    }

    mm = line.match(/^(\w[\w.-]*)\s*->\s*(\w[\w.-]*)\s*(?:"([^"]*)")?\s*(\{.*\})?\s*$/);
    if (mm) {
      relIdx++;
      const rel = { id: 'r' + String(relIdx).padStart(3, '0'), from: mm[1], to: mm[2] };
      if (mm[3]) rel.label = mm[3];
      if (mm[4]) {
        attrParse(mm[4], rel);
        if (rel.attrs && rel.attrs.id) rel.id = rel.attrs.id;
        if (rel.attrs && rel.attrs.src) rel.src = rel.attrs.src;
        delete rel.attrs;
      }
      m.relations.push(rel); i++; continue;
    }

    mm = line.match(/^([A-Z]\w+)\s+(\w[\w.-]*)\s+"([^"]*)"/);
    if (mm) {
      const elx = { id: mm[2], type: mm[1], label: mm[3], pos: [0, 0] };
      if (line.indexOf('{') !== -1) {
        const rb = readBody(line, i); i = rb[1];
        attrParse(rb[0], elx);
        if (elx.attrs && elx.attrs.src) elx.src = elx.attrs.src;
        delete elx.attrs;
      } else { i++; }
      m.elements.push(elx); continue;
    }

    i++;
  }

  /* auto-layout voor elementen zonder pos */
  let autoX = 30, autoY = 24;
  m.elements.forEach(e2 => {
    if (!e2.pos || (e2.pos[0] === 0 && e2.pos[1] === 0)) {
      e2.pos = [autoX, autoY]; autoX += 192;
      if (autoX > 1400) { autoX = 30; autoY += 118; }
    }
  });
  if (m.views.length === 0) {
    m.views = [
      { id: 'conceptueel', label: 'Conceptueel', include: { layers: ['motivation', 'strategy'] } },
      { id: 'logisch', label: 'Logisch', include: { layers: ['business', 'application'] } },
      { id: 'fysiek', label: 'Fysiek', include: { layers: ['technology'] } }
    ];
  }
  return m;
}

/* ============================================================
 * DSL SERIALIZER — DSL-B, Dragon1-compatibel.
 * Strict PascalCase types, GEEN :type op relaties, alleen gedeelde attr-keys.
 * ============================================================ */
function dslStr(s) {
  return String(s == null ? '' : s).replace(/"/g, "'").replace(/[\r\n]+/g, ' ').trim();
}
function modelToDSL(m) {
  const out = [];
  out.push('# ' + dslStr(m.meta.title || 'Model') + ' — ArchDSL (DSL-B), Dragon1-compatible.');
  out.push('# Types are strict PascalCase. Relations carry no :type — the engine infers it from');
  out.push('# the endpoint types. Only the shared attribute keys are used:');
  out.push('#   -fill  -stroke  -color  -icon  -description  -attr key = value');
  out.push('# Top-level keywords: set / pos / Viewpoint / Slide only.');
  if (m.meta.generated_from) out.push('# Sources: ' + dslStr(m.meta.generated_from));
  out.push('');
  if (m.meta.language) out.push('set language ' + dslStr(m.meta.language));
  if (m.meta.title) out.push('set title "' + dslStr(m.meta.title) + '"');
  if (m.meta.subtitle) out.push('set subtitle "' + dslStr(m.meta.subtitle) + '"');
  out.push('');
  out.push('# ---------------------------------------------------------------- elements');
  m.elements.forEach(e2 => {
    const a = [];
    if (e2.fill) a.push('-fill "' + dslStr(e2.fill) + '"');
    if (e2.stroke) a.push('-stroke "' + dslStr(e2.stroke) + '"');
    if (e2.color) a.push('-color "' + dslStr(e2.color) + '"');
    if (e2.icon) a.push('-icon "' + dslStr(e2.icon) + '"');
    if (e2.description) a.push('-description "' + dslStr(e2.description) + '"');
    if (e2.src) a.push('-attr src = "' + dslStr(e2.src) + '"');
    let line = e2.type + ' ' + e2.id + ' "' + dslStr(e2.label) + '"';
    if (a.length) line += ' { ' + a.join(' ') + ' }';
    out.push(line);
  });
  out.push('');
  out.push('# -------------------------------------------------------------- relations');
  m.relations.forEach(rl => {
    const a = ['-attr id = "' + dslStr(rl.id) + '"'];
    if (rl.src) a.push('-attr src = "' + dslStr(rl.src) + '"');
    if (rl.stroke) a.push('-stroke "' + dslStr(rl.stroke) + '"');
    if (rl.description) a.push('-description "' + dslStr(rl.description) + '"');
    let line = rl.from + ' -> ' + rl.to;
    if (rl.label) line += ' "' + dslStr(rl.label) + '"';
    line += ' { ' + a.join(' ') + ' }';
    out.push(line);
  });
  out.push('');
  out.push('# ------------------------------------------------------------- viewpoints');
  (m.views || []).forEach(v => {
    out.push('Viewpoint ' + v.id + ' "' + dslStr(v.label) + '" {');
    if (v.description) out.push('  -description "' + dslStr(v.description) + '"');
    if (v.source) out.push('  -attr src = "' + dslStr(v.source) + '"');
    if (v.canvas) out.push('  -attr canvas = "' + v.canvas[0] + ',' + v.canvas[1] + '"');
    if (v.scenarios && v.scenarios.length)
      out.push('  -attr scenarios = "' + v.scenarios.join(',') + '"');
    if (v.scenario) out.push('  -attr scenario_default = "' + v.scenario + '"');
    if (v.include && v.include.elements)
      out.push('  -attr elements = "' + v.include.elements.join(',') + '"');
    if (v.layout && Object.keys(v.layout).length) {
      const parts = Object.keys(v.layout).map(k => k + ':' + v.layout[k][0] + ',' + v.layout[k][1]);
      out.push('  -attr layout = "' + parts.join('|') + '"');
    }
    out.push('}');
  });
  out.push('');
  out.push('# ------------------------------------------------- scenarios (animation)');
  (m.scenarios || []).forEach(s => {
    out.push('Slide ' + s.id + ' "' + dslStr(s.label) + '" {');
    if (s.description) out.push('  -description "' + dslStr(s.description) + '"');
    if (s.source) out.push('  -attr src = "' + dslStr(s.source) + '"');
    (s.steps || []).forEach((st, ix) => {
      out.push('  -attr step_' + String(ix + 1).padStart(2, '0') +
               ' = "' + dslStr(st.rel) + ' :: ' + dslStr(st.narrative || '') + '"');
    });
    out.push('}');
  });
  out.push('');
  out.push('# -------------------------------------------------------------- positions');
  m.elements.forEach(e2 => {
    if (e2.pos) out.push('pos ' + e2.id + ' ' + e2.pos[0] + ', ' + e2.pos[1]);
  });
  out.push('');
  return out.join('\n');
}

/* ============================================================
 * .archimate placeholder — Archi v5 XML schrijver (minimum)
 * ============================================================ */
function modelToArchimate(m) {
  // Minimal Archi v5 archimate-model XML.
  const xmlEsc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                              .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
  xml += '<archimate:model xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" ';
  xml += 'xmlns:archimate="http://www.archimatetool.com/archimate" name="' + xmlEsc(m.meta.title || 'Model') + '">\n';
  const folders = {
    motivation: 'motivation', strategy: 'strategy', business: 'business',
    application: 'application', technology: 'technology',
    impl: 'implementation_migration', risk: 'other', other: 'other'
  };
  const byFolder = {};
  m.elements.forEach(e => {
    const f = folders[typeLayer(e.type)] || 'other';
    (byFolder[f] = byFolder[f] || []).push(e);
  });
  Object.keys(byFolder).forEach(folderName => {
    xml += '  <folder name="' + folderName + '" type="' + folderName + '">\n';
    byFolder[folderName].forEach(e => {
      xml += '    <element xsi:type="archimate:' + (TYPE_BANNER[(e.type || '').toLowerCase()] || e.type) +
             '" name="' + xmlEsc(e.label) + '" id="' + xmlEsc(e.id) + '"/>\n';
    });
    xml += '  </folder>\n';
  });
  xml += '  <folder name="Relations" type="relations">\n';
  m.relations.forEach(r => {
    const from = elemById(r.from), to = elemById(r.to);
    const type = r.type || inferRelType(from && from.type, to && to.type);
    xml += '    <element xsi:type="archimate:' + type.charAt(0).toUpperCase() + type.slice(1) +
           'Relationship" id="' + r.id + '" source="' + r.from + '" target="' + r.to + '"';
    if (r.label) xml += ' name="' + xmlEsc(r.label) + '"';
    xml += '/>\n';
  });
  xml += '  </folder>\n';
  xml += '</archimate:model>\n';
  return xml;
}

/* ============================================================
 * IO — download / file-read helpers
 * ============================================================ */
function download(filename, content, mime) {
  const blob = new Blob([content], { type: mime || 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}
function readFile(input, cb) {
  const f = input.files && input.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = e => cb(e.target.result, f.name);
  rd.readAsText(f);
}

/* ============================================================
 * INIT + WIRING
 * ============================================================ */
function populateViewSelect() {
  const sel = document.getElementById('viewSelect');
  sel.innerHTML = '';
  MODEL.views.forEach(v => {
    const o = document.createElement('option');
    o.value = v.id; o.textContent = v.label;
    sel.appendChild(o);
  });
  sel.value = currentViewId;
}

function init() {
  document.getElementById('viewer-title').textContent = MODEL.meta.title || 'Architectuur Viewer';
  populateViewSelect();
  render();

  // view select
  document.getElementById('viewSelect').addEventListener('change', e => {
    currentViewId = e.target.value;
    stopAnimation();
    clearLog();
    render();
  });

  // notation toggle
  document.querySelectorAll('#notationToggle button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#notationToggle button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      currentNotation = b.dataset.notation;
      // Heat-dropdown + sketch-knop alleen actief in Dragon1-modus.
      // Bij switch naar Dragon1: standaard 'criticality' aan om verschil direct zichtbaar te maken.
      // Bij switch naar ArchiMate: heat + sketch terug naar uit (statische laag-kleur, geen filter).
      const heatSel = document.getElementById('heatSelect');
      const sketchBtn = document.getElementById('btnSketch');
      if (currentNotation === 'dragon1') {
        heatSel.disabled = false;
        sketchBtn.disabled = false;
        if (currentHeat === 'off') {
          currentHeat = 'criticality';
          heatSel.value = 'criticality';
        }
      } else {
        heatSel.disabled = true;
        sketchBtn.disabled = true;
        currentHeat = 'off';
        heatSel.value = 'off';
        currentRenderMode = 'blueprint';
        sketchBtn.classList.remove('active');
      }
      render();
    });
  });

  // heat dropdown
  document.getElementById('heatSelect').addEventListener('change', e => {
    currentHeat = e.target.value;
    render();
  });

  // sketch toggle (Dragon1-only)
  document.getElementById('btnSketch').addEventListener('click', e => {
    if (e.target.disabled) return;
    currentRenderMode = (currentRenderMode === 'sketch') ? 'blueprint' : 'sketch';
    e.target.classList.toggle('active', currentRenderMode === 'sketch');
    render();
  });

  // anim controls
  document.getElementById('btnPlay').addEventListener('click', () => {
    if (!animState.playing) startAnimation();
  });
  document.getElementById('btnPause').addEventListener('click', () => {
    animState.playing = false;
    if (animState.rafHandle) cancelAnimationFrame(animState.rafHandle);
  });
  document.getElementById('btnStep').addEventListener('click', stepAnimation);
  document.getElementById('scenarioSelect').addEventListener('change', e => {
    stopAnimation();
    animState.scenarioId = e.target.value;
    animState.stepIdx = 0;
    clearLog();
    render();
  });
  document.getElementById('btnLoop').addEventListener('click', e => {
    animState.loop = !animState.loop;
    e.target.classList.toggle('active', animState.loop);
  });
  document.getElementById('speedSlider').addEventListener('input', e => {
    animState.speedMs = parseInt(e.target.value, 10);
  });

  // exports
  document.getElementById('btnExportJson').addEventListener('click', () => {
    download('MiraiCastLab_model.json', JSON.stringify(MODEL, null, 2), 'application/json');
  });
  document.getElementById('btnExportDsl').addEventListener('click', () => {
    download('MiraiCastLab_archdsl.dsl', modelToDSL(MODEL), 'text/plain');
  });
  document.getElementById('btnExportArchimate').addEventListener('click', () => {
    download('MiraiCastLab.archimate', modelToArchimate(MODEL), 'application/xml');
  });
  document.getElementById('btnExportSvg').addEventListener('click', () => {
    const svg = document.getElementById('canvas');
    const data = '<?xml version="1.0" encoding="UTF-8"?>\n' + svg.outerHTML;
    download('MiraiCastLab_' + currentViewId + '_' + currentNotation + '.svg', data, 'image/svg+xml');
  });

  // imports
  document.getElementById('impJson').addEventListener('change', e => {
    readFile(e.target, txt => {
      try { MODEL = JSON.parse(txt); afterImport(); }
      catch (err) { log('JSON import-fout: ' + err.message); }
    });
  });
  document.getElementById('impDsl').addEventListener('change', e => {
    readFile(e.target, txt => {
      try { MODEL = parseDSL(txt); afterImport(); }
      catch (err) { log('DSL parse-fout: ' + err.message); }
    });
  });
  document.getElementById('impArchimate').addEventListener('change', e => {
    log('.archimate-import: nog niet geïmplementeerd (placeholder). Gebruik .dsl of .json voor nu.');
  });

  // reset
  document.getElementById('btnReset').addEventListener('click', () => {
    MODEL = clone(DEFAULT_MODEL);
    currentViewId = MODEL.views[0].id;
    afterImport();
  });
}

function afterImport() {
  currentViewId = (MODEL.views && MODEL.views[0] && MODEL.views[0].id) || 'conceptueel';
  document.getElementById('viewer-title').textContent = MODEL.meta.title || 'Architectuur Viewer';
  populateViewSelect();
  clearLog();
  render();
}

init();
</script>
